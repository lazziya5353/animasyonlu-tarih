name: "8 · Yorum ajanı"
on:
  schedule:
    - cron: "40 7 * * *"   # Her gün 10:40 (İstanbul)
  workflow_dispatch:
    inputs:
      mod: { description: "topla / gonder", required: false, default: "topla" }
permissions:
  contents: write
concurrency: { group: repo-yazma, cancel-in-progress: false }
jobs:
  yorum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      MOD: ${{ inputs.mod || 'topla' }}
    steps:
      - name: Girdiyi kontrol et
        run: echo "$MOD" | grep -Eq '^(topla|gonder)$' || (echo 'Geçersiz mod'; exit 1)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Yorumlar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/yorumcu.py "$MOD"
      - name: Kaydet
        if: always()
        run: |
          git config user.name "tarih-ajan"; git config user.email "ajan@users.noreply.github.com"
          git add data; git commit -m "Yorum ajanı: $MOD" || exit 0
          (git pull --rebase || (git rebase --abort; git pull --no-rebase --no-edit -X ours)) && git push
