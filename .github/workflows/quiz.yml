name: "Quiz · Her Harfe Bir Tarih Sorusu"
# Ses (Gemini, ucretsiz) -> scripts/harf_quiz.py ile video -> scripts/quiz_kontrol.py -> release video-<slug>
on:
  workflow_dispatch:
    inputs:
      slug: { description: "Proje klasörü (örn. her-harfe-tarih-3)", required: true }
      ses: { description: "Sesi yeniden üret (1 = evet; ses.wav yoksa her zaman üretilir)", required: false, default: "" }
      bolum: { description: "Kapakta 'N. BÖLÜM' satırı (boş = yok)", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: repo-yazma, cancel-in-progress: false }
jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      PANEL_URL: ${{ vars.PANEL_URL }}
      SLUG: ${{ inputs.slug }}
    steps:
      - name: Proje adını kontrol et
        run: echo "$SLUG" | grep -Eq '^[a-z0-9-]+$' || (echo 'Geçersiz proje adı'; exit 1)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ffmpeg kur
        timeout-minutes: 10
        run: bash scripts/ffmpeg_kur.sh
      - timeout-minutes: 10
        run: pip install -q numpy soundfile pillow faster-whisper
      - name: Ses
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SES: ${{ inputs.ses }}
        run: |
          if [ "$SES" = "1" ] || [ ! -f "projects/$SLUG/ses.wav" ]; then
            python scripts/generate_assets.py --slug "$SLUG" --ses
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add "projects/$SLUG"; git commit -m "Quiz sesi: $SLUG" && (git pull --rebase -q; git push) || true
          fi
      - name: Video + kapak
        env: { BOLUM: "${{ inputs.bolum }}" }
        run: |
          P=projects/$SLUG; mkdir -p $P/out
          python scripts/harf_quiz.py $P/script.json $P/ses.wav $P/out/video.mp4
          B=""; echo "$BOLUM" | grep -Eq '^[0-9]+$' && B="--bolum $BOLUM"
          python scripts/quiz_kapak.py $P/script.json $P/out/kapak.jpg $B
      - name: Otomatik kontroller
        run: python scripts/quiz_kontrol.py projects/$SLUG/out/video.mp4 projects/$SLUG/script.json
      - name: Release
        run: |
          TAG="video-$SLUG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$SLUG" --notes "Animasyonlu Tarih quiz videosu"
          gh release upload "$TAG" "projects/$SLUG/out/video.mp4" "projects/$SLUG/out/kapak.jpg" --clobber
          python scripts/set_status.py kurgucu tamam "$SLUG quiz videosu hazır" "release:$TAG" || true
      - name: Hata durumunu panele yaz
        if: failure()
        run: python scripts/set_status.py kurgucu hata "$SLUG quiz üretilemedi, GitHub Actions kaydına bak" || true
