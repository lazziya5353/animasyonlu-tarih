name: "4 · Kurgucu (video)"
on:
  workflow_dispatch:
    inputs:
      slug: { description: "Proje klasörü (projects/ altındaki ad)", required: true }
permissions:
  contents: write
concurrency:
  group: render-${{ inputs.slug }}
  cancel-in-progress: true
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}   # canlı olaylar için (Kurgu Stüdyosu)
      PANEL_URL: ${{ vars.PANEL_URL }}
      SLUG: ${{ inputs.slug }}
    steps:
      - name: Proje adını kontrol et
        run: echo "$SLUG" | grep -Eq '^[a-z0-9-]{1,60}$' || (echo 'Geçersiz proje adı'; exit 1)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ffmpeg kur
        timeout-minutes: 10
        run: bash scripts/ffmpeg_kur.sh
      - timeout-minutes: 10
        run: pip install -q -r requirements.txt
      - name: Videoyu üret
        run: |
          python scripts/set_status.py kurgucu calisiyor "$SLUG videosu üretiliyor"
          python engine/render.py "projects/$SLUG"
          python engine/render.py "projects/$SLUG" --preview 2 15 30 45 --out "projects/$SLUG/onizleme.jpg"
      - name: Kurgu kontrolcüsü (kare, ses seviyesi, senkron)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/kontrol.py kurgu --slug "$SLUG"
      - name: Videoyu yayınla (GitHub Release)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="video-$SLUG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$SLUG" --notes "Animasyonlu Tarih videosu"
          gh release upload "$TAG" "projects/$SLUG/out/video.mp4" --clobber
          python scripts/set_status.py kurgucu tamam "$SLUG videosu hazır" "release:$TAG"
      - name: Hata durumunu panele yaz
        if: failure()
        run: python scripts/set_status.py kurgucu hata "$SLUG videosu üretilemedi, GitHub Actions kaydına bak"
      - name: Kaydet
        if: always()
        run: |
          git config user.name "tarih-ajan"; git config user.email "ajan@users.noreply.github.com"
          git add "projects/$SLUG/onizleme.jpg" "projects/$SLUG/project.timed.json" "projects/$SLUG/kontrol" data 2>/dev/null; git commit -m "Video: $SLUG" || exit 0
          (git pull --rebase || (git rebase --abort; git pull --no-rebase --no-edit -X ours)) && git push
      - name: Telefona bildir
        if: always()
        env: { GH_TOKEN: "${{ github.token }}", DURUM: "${{ job.status }}" }
        run: |
          if [ "$DURUM" = "success" ]; then python scripts/bildir.py "🎬 Video hazır" "{ad} izlemeye ve paylaşmaya hazır" --slug "$SLUG"
          elif [ "$DURUM" = "failure" ]; then python scripts/bildir.py "❌ Video üretilemedi" "{ad}: panelde Düzelt'e basabilirsin" --slug "$SLUG"; fi
