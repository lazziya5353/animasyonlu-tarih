name: "3 · Görsel + Ses (Gemini)"
on:
  workflow_dispatch:
    inputs:
      slug: { description: "Proje klasörü (projects/ altındaki ad)", required: true }
      only: { description: "Sadece bu görseli yeniden üret (numara, isteğe bağlı)", required: false, default: "" }
      ses: { description: "Sadece sesi yeniden üret (1 = evet)", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: repo-yazma, cancel-in-progress: false }
jobs:
  uret:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      SLUG: ${{ inputs.slug }}
    steps:
      - name: Proje adını kontrol et
        run: echo "$SLUG" | grep -Eq '^[a-z0-9-]+$' || (echo 'Geçersiz proje adı'; exit 1)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy soundfile pillow
      - name: Üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ inputs.only }}
          SES: ${{ inputs.ses }}
        run: |
          ARGS="--slug $SLUG"
          echo "$ONLY" | grep -Eq '^[0-9]+$' && ARGS="$ARGS --only $ONLY"
          [ "$SES" = "1" ] && ARGS="$ARGS --ses"
          python scripts/generate_assets.py $ARGS
      - name: Ses ve görsel kontrolcüleri (Gemini ücretsiz kota)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -f "projects/$SLUG/ses.wav" ] && python scripts/kontrol.py ses --slug "$SLUG" --onar
          python scripts/kontrol.py gorsel --slug "$SLUG"
      - name: Kaydet
        if: always()
        run: |
          git config user.name "tarih-ajan"; git config user.email "ajan@users.noreply.github.com"
          git add projects data; git commit -m "Görsel/ses: $SLUG" || exit 0
          git pull --rebase && git push
